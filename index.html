<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>안심길</title>
<meta name="description" content="성남 은행동 어르신을 위한 덜 힘든 길 안내">
<meta name="theme-color" content="#2C5AA0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안심길">
<style>
@font-face{font-family:'Pretendard';src:url(assets/PretendardVariable.woff2) format('woff2');font-weight:100 900;font-display:swap}
body{margin:0;background:#ECEFF4}
a{color:#2C5AA0}a:hover{color:#1F467F}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #2C5AA0;outline-offset:2px}
input::placeholder{color:#8A93A3}
html,body{height:100%;overflow:hidden}
body{background:#FFFFFF;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.desktop{background:#ECEFF4}
#app{position:absolute;top:0;left:0;width:390px;transform-origin:0 0;overflow:hidden}
#app img{-webkit-user-drag:none;user-select:none}
body.desktop #app{border-radius:28px;box-shadow:0 10px 40px rgba(27,36,51,.18)}
#app > div{height:var(--app-h,844px) !important}
</style>
</head>
<body>
<div id="app"></div>
<template id="app-template">
<div style="--fs: {{fs}}; width: 390px; height: var(--app-h, 844px); display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1B2433; overflow: hidden; position: relative; letter-spacing: -0.01em">

<!-- ═══ 01 시작 ═══ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: var(--app-h, 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px">
    <div style="display: flex; align-items: center; gap: 8px">
      <img src="assets/logo.png" alt="" width="32" height="32" style="display: block; width: 32px; height: 32px">
      <span style="font-size: calc(22px * var(--fs, 1)); font-weight: 800">안심길</span>
    </div>
    <button onClick="{{openSettings}}" aria-label="설정" style="width: 48px; height: 48px; border: none; background: transparent; border-radius: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
  </div>
  <div style="margin: 0 20px; border-radius: 18px; background: #F3F5F8; padding: 6px">
    <button onClick="{{pickStart}}" style="width: 100%; height: 56px; border: none; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 12px; cursor: pointer; text-align: left">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #1B2433; flex-shrink: 0"></span>
      <span style="font-size: calc(15px * var(--fs, 1)); color: #667085; width: 32px">출발</span>
      <span style="font-size: calc(18px * var(--fs, 1)); font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{startName}}</span>
    </button>
    <div style="height: 1px; background: #E2E7EF; margin: 0 12px"></div>
    <button onClick="{{pickDest}}" style="width: 100%; height: 56px; border: none; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 12px; cursor: pointer; text-align: left">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #2C5AA0; flex-shrink: 0"></span>
      <span style="font-size: calc(15px * var(--fs, 1)); color: #667085; width: 32px">도착</span>
      <span style="font-size: calc(18px * var(--fs, 1)); font-weight: 600; color: #8A93A3; flex: 1">어디로 가세요?</span>
    </button>
  </div>
  <div onPointerDown="{{mapH.down}}" onPointerMove="{{mapH.move}}" onPointerUp="{{mapH.up}}" onPointerCancel="{{mapH.up}}" onWheel="{{mapH.wheel}}" style="position: relative; width: 390px; height: 220px; overflow: hidden; margin-top: 14px; flex-shrink: 0; touch-action: none; cursor: grab">
    <div style="{{mapH.layer}}">
      <img src="{{zoneMap}}" alt="{{zoneName}} 지도" draggable="false" style="{{zoneImg}}">
      <sc-for list="{{homeDots}}" as="m" hint-placeholder-count="6"><span style="{{m.style}}"></span></sc-for>
    </div>
  <div style="position: absolute; right: 10px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 5">
    <div style="display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(27,36,51,0.18)">
      <button onClick="{{mapH.zin}}" aria-label="지도 확대" style="width: 44px; height: 44px; border: none; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ECEFF4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button onClick="{{mapH.zout}}" aria-label="지도 축소" style="width: 44px; height: 44px; border: none; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    </div>
    <sc-if value="{{mapH.moved}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{mapH.reset}}" aria-label="처음 위치로" style="width: 44px; height: 44px; border: none; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 12px; box-shadow: 0 2px 8px rgba(27,36,51,0.18)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5AA0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="1.6" fill="#2C5AA0"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
    </sc-if>
  </div>

    <span style="position: absolute; left: 12px; top: 10px; font-size: calc(13px * var(--fs, 1)); font-weight: 700; background: #FFFFFF; padding: 5px 10px; border-radius: 999px">{{zoneName}} · 갈 수 있는 곳 {{zoneCount}}곳</span>
    <span style="position: absolute; right: 8px; bottom: 6px; font-size: calc(10px * var(--fs, 1)); color: #667085">© OpenStreetMap</span>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 18px 20px 24px">
    <h2 style="margin: 0 0 10px; font-size: calc(16px * var(--fs, 1)); font-weight: 700; color: #667085">자주 가는 곳</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{favs}}" as="f" hint-placeholder-count="3">
        <button onClick="{{f.go}}" style="min-height: 92px; border: none; border-radius: 16px; background: #F3F5F8; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; cursor: pointer; text-align: left">
          <span style="width: 30px; height: 30px; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#2C5AA0" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></span>
          <span style="font-size: calc(15px * var(--fs, 1)); font-weight: 700; line-height: 1.3; word-break: keep-all">{{f.name}}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin: 22px 0 2px; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: calc(16px * var(--fs, 1)); font-weight: 700; color: #667085">최근 검색</h2>
      <sc-if value="{{hasRecent}}" hint-placeholder-val="{{ true }}"><button onClick="{{clearRecent}}" style="height: 36px; padding: 0 6px; border: none; background: transparent; font-size: calc(14px * var(--fs, 1)); color: #667085; cursor: pointer">모두 지우기</button></sc-if>
    </div>
    <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
      <button onClick="{{r.go}}" style="width: 100%; height: 56px; border: none; border-bottom: 1px solid #ECEFF4; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 2px; cursor: pointer; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
        <span style="font-size: calc(17px * var(--fs, 1)); font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.name}}</span>
        <span style="font-size: calc(14px * var(--fs, 1)); color: #8A93A3">{{r.kind}}</span>
      </button>
    </sc-for>
    <sc-if value="{{noRecent}}" hint-placeholder-val="{{ false }}"><p style="margin: 12px 0 0; font-size: calc(15px * var(--fs, 1)); color: #8A93A3">최근 찾은 장소가 없어요</p></sc-if>
  </div>
</div>
</sc-if>

<!-- ═══ 장소 고르기 (출발/도착) ═══ -->
<sc-if value="{{isPick}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: var(--app-h, 844px)">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px">
    <button onClick="{{pickBack}}" aria-label="뒤로" style="width: 48px; height: 48px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 style="margin: 0; font-size: calc(21px * var(--fs, 1)); font-weight: 800">{{pickTitle}}</h1>
  </div>
  <div style="margin: 0 20px 8px; height: 54px; border-radius: 14px; background: #F3F5F8; display: flex; align-items: center; gap: 10px; padding: 0 14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">장소 검색</label>
    <input id="q" value="{{q}}" onInput="{{onQ}}" placeholder="장소 이름 검색" style="flex: 1; border: none; background: transparent; font-size: calc(18px * var(--fs, 1)); color: #1B2433; outline: none; min-width: 0">
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px">
    <sc-if value="{{showGps}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{useGps}}" style="width: 100%; min-height: 60px; border: none; border-bottom: 1px solid #ECEFF4; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 6px 2px; cursor: pointer; text-align: left">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #EAF0F8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5AA0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: calc(18px * var(--fs, 1)); font-weight: 700; color: #2C5AA0">{{gpsLabel}}</span><span style="font-size: calc(13px * var(--fs, 1)); color: #667085">가장 가까운 장소를 출발지로 정해요</span></span>
      </button>
    </sc-if>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="padding: 14px 0 4px; font-size: calc(14px * var(--fs, 1)); font-weight: 700; color: #667085">{{g.title}}</div>
      <sc-for list="{{g.items}}" as="p" hint-placeholder-count="4">
        <button onClick="{{p.go}}" style="width: 100%; min-height: 58px; border: none; border-bottom: 1px solid #ECEFF4; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 6px 2px; cursor: pointer; text-align: left">
          <span style="font-size: calc(18px * var(--fs, 1)); font-weight: 600; flex: 1">{{p.name}}</span>
          <span style="font-size: calc(14px * var(--fs, 1)); color: #667085">{{p.kind}}</span>
        </button>
      </sc-for>
    </sc-for>
    <sc-if value="{{noResult}}" hint-placeholder-val="{{ false }}"><p style="margin: 24px 0; text-align: center; font-size: calc(17px * var(--fs, 1)); color: #667085">찾은 장소가 없어요. 이름을 다시 입력해 주세요.</p></sc-if>
    <sc-if value="{{showZoneNote}}" hint-placeholder-val="{{ false }}"><p style="margin: 18px 0 0; font-size: calc(14px * var(--fs, 1)); color: #667085; line-height: 1.5">출발지와 같은 구역의 장소만 안내할 수 있어요. 다른 구역은 길 데이터를 연결하는 중이에요.</p></sc-if>
  </div>
</div>
</sc-if>

<!-- ═══ 03 길 찾는 중 ═══ -->
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: var(--app-h, 844px); gap: 18px; padding: 0 32px; text-align: center">
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="#EAF0F8" stroke-width="7"></circle><path d="M32 6a26 26 0 0 1 26 26" fill="none" stroke="#2C5AA0" stroke-width="7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="0.9s" repeatCount="indefinite"></animateTransform></path></svg>
  <span style="font-size: calc(22px * var(--fs, 1)); font-weight: 800">길을 찾고 있어요</span>
  <span style="font-size: calc(17px * var(--fs, 1)); color: #667085">{{startName}} → {{destName}}</span>
  <button onClick="{{cancelSearch}}" style="margin-top: 12px; height: 48px; padding: 0 22px; border: none; border-radius: 12px; background: #F3F5F8; font-size: calc(16px * var(--fs, 1)); font-weight: 600; color: #1B2433; cursor: pointer">취소</button>
</div>
</sc-if>

<!-- ═══ 04 길찾기 결과 ═══ -->
<sc-if value="{{isResult}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: var(--app-h, 844px); background: #FFFFFF">
  <div style="display: flex; align-items: center; gap: 6px; padding: 10px 14px 10px 6px">
    <button onClick="{{goHome}}" aria-label="뒤로" style="width: 44px; height: 48px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1; min-width: 0; background: #FFFFFF; border: 1.5px solid #D8DEE8; border-radius: 16px; padding: 4px 14px; display: flex; flex-direction: column; position: relative">
      <span style="position: absolute; left: 19px; top: 27px; height: 26px; border-left: 2px dotted #B7BFCC"></span>
      <span style="display: flex; align-items: center; gap: 10px; min-height: 38px; min-width: 0; border-bottom: 1px solid #ECEFF4">
        <span style="width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 3px solid #1B2433; background: #FFFFFF; flex-shrink: 0"></span>
        <span style="font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: #667085; width: 28px; flex-shrink: 0">출발</span>
        <span style="font-size: calc(16px * var(--fs, 1)); font-weight: 600; color: #1B2433; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{startName}}</span>
      </span>
      <span style="display: flex; align-items: center; gap: 10px; min-height: 40px; min-width: 0">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #2C5AA0; box-shadow: 0 0 0 3px #EAF0F8; flex-shrink: 0"></span>
        <span style="font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: #2C5AA0; width: 28px; flex-shrink: 0">도착</span>
        <span style="font-size: calc(17px * var(--fs, 1)); font-weight: 800; color: #1B2433; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{destName}}</span>
      </span>
    </div>
  </div>
  <div onPointerDown="{{mapR.down}}" onPointerMove="{{mapR.move}}" onPointerUp="{{mapR.up}}" onPointerCancel="{{mapR.up}}" onWheel="{{mapR.wheel}}" style="position: relative; width: 390px; height: 300px; flex-shrink: 0; overflow: hidden; touch-action: none; cursor: grab">
    <div style="{{mapR.layer}}">
    <img src="{{zoneMap}}" alt="{{mapAlt}}" draggable="false" style="{{zoneImg}}">
    <svg viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; top: 0; overflow: visible" aria-hidden="true">
      <path d="{{otherD}}" fill="none" stroke="#FFFFFF" stroke-width="{{rk.w7}}" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
      <path d="{{otherD}}" fill="none" stroke="#8A93A3" stroke-width="{{rk.w4}}" stroke-dasharray="{{rk.dash}}" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="{{mainD}}" fill="none" stroke="{{mainGlow}}" stroke-width="{{rk.w18}}" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"></path>
      <path d="{{mainD}}" fill="none" stroke="#FFFFFF" stroke-width="{{rk.w11}}" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="{{mainD}}" fill="none" stroke="{{mainColor}}" stroke-width="{{rk.w7}}" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="{{sx}}" cy="{{sy}}" r="{{rk.r8}}" fill="#1B2433" stroke="#FFFFFF" stroke-width="{{rk.w3}}"></circle>
      <circle cx="{{ex}}" cy="{{ey}}" r="{{rk.r9}}" fill="#2C5AA0" stroke="#FFFFFF" stroke-width="{{rk.w3}}"></circle>
      <g transform="{{b0.t}}" display="{{b0.disp}}">
        <line x1="0" y1="0" x2="0" y2="-14" stroke="#475066" stroke-width="1.5"></line>
        <rect x="{{b0.x}}" y="-38" width="{{b0.w}}" height="24" rx="12" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="1" style="filter: drop-shadow(0 2px 3px rgba(27,36,51,0.12))"></rect>
        <path transform="{{b0.iconT}}" display="{{b0.isStairs}}" d="M0 12h4V8h4V4h4V0h3" fill="none" stroke="#475066" stroke-width="1.8" stroke-linejoin="round"></path>
        <path transform="{{b0.iconT}}" display="{{b0.isSlope}}" d="M0 12L15 2M0 12h15" fill="none" stroke="#475066" stroke-width="1.8" stroke-linecap="round"></path>
        <g transform="{{b0.iconT}}" display="{{b0.isOther}}"><circle cx="7" cy="6" r="6" fill="none" stroke="#475066" stroke-width="1.8"></circle><path d="M7 3v3.5M7 9v.3" stroke="#475066" stroke-width="1.8" stroke-linecap="round"></path></g>
        <text x="{{b0.tx}}" y="-21.5" font-size="12" font-weight="700" fill="#475066" style="font-family: 'Pretendard', sans-serif">{{b0.label}}</text>
        <circle r="4" fill="#475066" stroke="#FFFFFF" stroke-width="2"></circle>
      </g>
      <g transform="{{b1.t}}" display="{{b1.disp}}">
        <line x1="0" y1="0" x2="0" y2="-14" stroke="#475066" stroke-width="1.5"></line>
        <rect x="{{b1.x}}" y="-38" width="{{b1.w}}" height="24" rx="12" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="1" style="filter: drop-shadow(0 2px 3px rgba(27,36,51,0.12))"></rect>
        <path transform="{{b1.iconT}}" display="{{b1.isStairs}}" d="M0 12h4V8h4V4h4V0h3" fill="none" stroke="#475066" stroke-width="1.8" stroke-linejoin="round"></path>
        <path transform="{{b1.iconT}}" display="{{b1.isSlope}}" d="M0 12L15 2M0 12h15" fill="none" stroke="#475066" stroke-width="1.8" stroke-linecap="round"></path>
        <g transform="{{b1.iconT}}" display="{{b1.isOther}}"><circle cx="7" cy="6" r="6" fill="none" stroke="#475066" stroke-width="1.8"></circle><path d="M7 3v3.5M7 9v.3" stroke="#475066" stroke-width="1.8" stroke-linecap="round"></path></g>
        <text x="{{b1.tx}}" y="-21.5" font-size="12" font-weight="700" fill="#475066" style="font-family: 'Pretendard', sans-serif">{{b1.label}}</text>
        <circle r="4" fill="#475066" stroke="#FFFFFF" stroke-width="2"></circle>
      </g>
      <g transform="{{safeT}}" display="{{safeDisp}}">
          <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#2C5AA0"></rect>
          <path d="M-34 -1l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
          <text x="-18" y="4.5" font-size="12.5" font-weight="800" fill="#FFFFFF" style="font-family: 'Pretendard', sans-serif">덜 힘든 길</text>
        </g>
    </svg>
    </div>
  <div style="position: absolute; right: 10px; bottom: 30px; display: flex; flex-direction: column; gap: 8px; z-index: 5">
    <div style="display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(27,36,51,0.18)">
